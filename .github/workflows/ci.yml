name: ci

on:
  push:
  pull_request:

jobs:
  consultation-python310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest pytest-asyncio
      - name: Test consultation lifetime on the minimum Python version
        # Full EngineSession dependencies/integration run in the 3.12 job.
        run: pytest -q tests/test_callosum_lifecycle.py tests/test_turn_lifecycle.py -k 'not engine_session'

  memory-commit-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: memory_retry_test
          POSTGRES_USER: memory_test
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory_test -d memory_retry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r requirements-pg.txt
      - name: Test atomic memory commits and acknowledgement loss
        env:
          DUALBRAIN_TEST_PG_DSN: postgresql://memory_test:isolated-test-only@127.0.0.1:5432/memory_retry_test
        run: pytest -q tests/test_memory_commit_postgres.py

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q --ignore=tests/test_gateway_contract.py

      - name: Run trace UI tests
        run: node --test tests/test_trace_theater.mjs tests/test_trace_selection.mjs tests/test_live_history.mjs

  gateway-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run gateway contract tests
        run: pytest -q tests/test_gateway_contract.py
